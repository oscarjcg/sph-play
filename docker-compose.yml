x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/usr/src/sph-basic
    - node_modules:/usr/src/sph-basic/node_modules

services:
  sph-basic:
    <<: *app
    container_name: sph-basic
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host"

  build:
    <<: *app
    profiles: ["build"]
    command: sh -c "npm install --no-audit --no-fund && npm run build"

volumes:
  node_modules:
